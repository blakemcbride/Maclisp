; KLH10 configuration for the Maclisp ITS system (KS10, one RP06).
; run.sh copies this into run/ and starts the emulator there.

; Two RH11s, each on its own Unibus
devdef rh0  ub1   rh11   addr=776700 br=6 vec=254
devdef rh1  ub3   rh11   addr=772440 br=6 vec=224

; One disk and one tape drive, as ITS expects
devdef dsk0 rh0.0 rp     type=rp06 format=dbd9 path=rp0.dsk iodly=0
devdef mta0 rh1.0 tm02   fmtr=tm03 type=tu45

; ITS wants a 60Hz clock
set clk_ithzfix=60

; ITS is built expecting an IMP (Arpanet/Internet) and a Chaosnet interface,
; and halts at boot if the Chaosnet one is missing.  Neither is connected to
; anything here: the IMP helper needs root to open a network tunnel and just
; prints warnings without it, and the Chaosnet interface talks UDP to a
; bridge on localhost that is not running.
devdef imp  ub3   lhdh   addr=767600 br=6 vec=250 ipaddr=192.168.1.100 gwaddr=192.168.0.45
devdef dz0  ub3   dz11   addr=760010 br=5 vec=340
devdef chaos ub3  ch11   addr=764140 br=6 vec=270 myaddr=177002 chudpport=44042 chip=177001/localhost:44041

; Lets ITS idle the host CPU when it has nothing to do
devdef idler ub3 host addr=777000

load @.ddt-u
load dskdmp.216bin
